<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corujinha Mila - Chat Educacional</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="icon" type="image/png" href="../assets/nexinha.png" />
    <link rel="stylesheet" href="chat.css">
    <style>
        /* Estilo extra para a barra lateral */
        .chat-layout { display: flex; height: 100vh; overflow: hidden; }
        .sidebar {
            width: 280px; background: var(--bg-card); border-right: 1px solid var(--border-color);
            display: flex; flex-direction: column; transition: transform 0.3s; z-index: 20;
        }
        .sidebar-header { padding: 15px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .sidebar-header h2 { font-size: 14px; color: var(--text-main); }
        .new-chat-btn { background: var(--neon-green); color: var(--bg-dark); border: none; padding: 8px 12px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 12px; }
        .history-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .history-item { background: var(--bg-input); padding: 12px; border-radius: 12px; cursor: pointer; border: 1px solid transparent; transition: 0.2s; }
        .history-item:hover { border-color: var(--neon-green); }
        .history-item h4 { font-size: 12px; color: var(--text-main); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .history-item p { font-size: 10px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .main-chat-area { flex: 1; display: flex; flex-direction: column; }
        
        .mobile-menu-btn { display: none; background: none; border: none; color: var(--text-main); font-size: 24px; cursor: pointer; margin-right: 10px; }
        @media (max-width: 768px) {
            .sidebar { position: absolute; height: 100%; transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .mobile-menu-btn { display: block; }
        }
    </style>
</head>
<body>

    <div class="chat-layout">
        <!-- Barra Lateral de Histórico -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>Histórico</h2>
                <button class="new-chat-btn" onclick="startNewChat()">+ Novo</button>
            </div>
            <div class="history-list" id="historyList">
                <!-- Histórico será injetado via JS -->
            </div>
        </aside>

        <!-- Área Principal do Chat -->
        <div class="main-chat-area">
            <header class="chat-header">
                <button class="mobile-menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">
                    <i class="ph ph-list"></i>
                </button>
                <a href="../index.html" class="back-btn">
                    <i class="ph ph-caret-left"></i>
                </a>
                <div class="chat-header-info">
                    <div class="avatar-header">
                        <img src="../assets/iconMilaCoruja.png" alt="Corujinha Mila" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">
                    </div>
                    <div>
                        <h1>Corujinha Mila</h1>
                        <p><span class="status-dot"></span> Online para estudos</p>
                    </div>
                </div>
            </header>

            <main class="chat-container">
                <div class="chat-messages" id="chatMessages">
                    <!-- As mensagens aparecerão aqui -->
                </div>
            </main>

            <footer class="chat-input-area">
                <div class="input-wrapper">
                    <input type="text" id="chatInput" placeholder="Pergunte sobre seus estudos..." autocomplete="off">
                    <button id="sendBtn" class="send-btn">
                        <i class="ph ph-paper-plane-right"></i>
                    </button>
                </div>
            </footer>
        </div>
    </div>

    <script type="module" src="chat.js"></script>
</body>
</html>
